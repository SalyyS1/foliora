[package]
name = "foliora-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
default-run = "foliora-desktop"

[lib]
name = "foliora_desktop"
path = "src/lib.rs"

[dependencies]
foliora-domain = { path = "../../../crates/domain" }
foliora-export = { path = "../../../crates/export" }
foliora-ingestion = { path = "../../../crates/ingestion" }
foliora-model = { path = "../../../crates/model" }
foliora-sync = { path = "../../../crates/sync" }
foliora-vault = { path = "../../../crates/vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
dirs = "6"
subtle = "2"
tauri = { version = "2.8", default-features = false, features = ["wry"] }
tauri-plugin-clipboard-manager = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["time"] }
ttf-noto-sans = "=0.1.2"
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
lopdf = "0.44"
