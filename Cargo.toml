[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/domain",
    "crates/vault",
    "crates/ingestion",
    "crates/model",
    "crates/export",
    "crates/sync",
    "services/sync",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/SalyyS1/foliora"

[workspace.lints.rust]
unsafe_code = "forbid"

# Tauri and PDF dependencies otherwise produce several gigabytes of duplicate
# PDB/incremental artifacts on Windows developer machines and CI runners.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = "symbols"
