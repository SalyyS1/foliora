[package]
name = "foliora-ingestion"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"

[dependencies]
foliora-domain = { path = "../domain" }
html2text = { version = "0.17", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.44"
mailparse = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wait-timeout = "0.2"
