[package]
name = "foliora-export"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
foliora-domain = { path = "../domain" }
foliora-ingestion = { path = "../ingestion" }
getrandom = "0.2"
printpdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[[bin]]
name = "foliora"
path = "src/bin/foliora.rs"
